<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PolicyPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0b0b0e;
      --surface:      #111116;
      --surface-2:    #18181f;
      --surface-3:    #1f1f28;
      --border:       rgba(255,255,255,0.07);
      --border-mid:   rgba(255,255,255,0.11);
      --accent:       #7c6af7;
      --accent-dim:   rgba(124,106,247,0.12);
      --accent-focus: rgba(124,106,247,0.4);
      --text:         #e2e2ea;
      --text-muted:   #56566a;
      --text-soft:    #9898ae;
      --success:      #4ade80;
      --error:        #f87171;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

    /* ── Shell ── */
    .container {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      padding: 20px 26px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 34px;
      height: 34px;
      background: var(--accent-dim);
      border: 1px solid rgba(124,106,247,0.2);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .header-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* ── Upload ── */
    .upload-section {
      padding: 20px 26px;
      border-bottom: 1px solid var(--border);
    }

    .upload-tabs {
      display: inline-flex;
      gap: 2px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 16px;
    }

    .upload-tab {
      padding: 5px 14px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 5px;
      transition: background 0.15s, color 0.15s;
      font-family: inherit;
      letter-spacing: 0.01em;
    }

    .upload-tab.active {
      background: var(--surface-3);
      color: var(--text);
      border: 1px solid var(--border-mid);
    }

    .upload-panel { display: none; }
    .upload-panel.active { display: block; }

    .field-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .upload-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 9px 13px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.18s;
      font-family: inherit;
    }

    input[type="text"]::placeholder { color: var(--text-muted); }
    input[type="text"]:focus { border-color: var(--accent-focus); }
    input[type="text"]:disabled { opacity: 0.35; }

    .btn {
      padding: 9px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.18s;
      font-family: inherit;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .btn:hover   { opacity: 0.85; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* File drop zone */
    .file-drop {
      border: 1px dashed var(--border-mid);
      border-radius: 10px;
      padding: 26px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .file-drop:hover, .file-drop.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .file-drop input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-drop-icon {
      font-size: 1.3rem;
      margin-bottom: 6px;
      display: block;
      opacity: 0.5;
    }

    .file-drop-text {
      font-size: 0.8rem;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .file-name {
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
    }

    .file-upload-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    /* Status */
    .status {
      margin-top: 10px;
      font-size: 0.75rem;
      min-height: 16px;
      color: var(--text-muted);
    }

    .status.success { color: var(--success); }
    .status.error   { color: var(--error); }
    .status.loading { color: var(--text-soft); }

    /* ── Chat ── */
    .chat-section {
      display: flex;
      flex-direction: column;
      height: 460px;
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .empty-icon {
      font-size: 1.5rem;
      display: block;
      margin-bottom: 8px;
      opacity: 0.35;
    }

    /* Bubbles */
    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .bubble-row.user { flex-direction: row-reverse; }

    .bubble {
      max-width: 74%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.855rem;
      line-height: 1.65;
    }

    .bubble.bot {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.thinking {
      color: var(--text-muted);
    }

    .dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
      margin: 0 2px 1px;
      animation: blink 1.2s infinite;
      vertical-align: middle;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 8px;
      padding: 14px 26px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-row input[type="text"] {
      border-radius: 10px;
    }

    .btn-send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      width: 40px;
      height: 40px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.18s;
      flex-shrink: 0;
    }

    .btn-send:hover   { opacity: 0.85; }
    .btn-send:disabled { opacity: 0.25; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-icon">📄</div>
    <div class="header-text">
      <h1>PolicyPal</h1>
      <p>Chat with any policy document using AI</p>
    </div>
  </div>

  <!-- Upload -->
  <div class="upload-section">
    <div class="upload-tabs">
      <button class="upload-tab active" id="tabUrl" onclick="switchTab('url')">Paste URL</button>
      <button class="upload-tab" id="tabFile" onclick="switchTab('file')">Upload File</button>
    </div>

    <div class="upload-panel active" id="panelUrl">
      <label class="field-label">Document URL — PDF, DOCX, or EML</label>
      <div class="upload-row">
        <input type="text" id="docUrl" placeholder="https://example.com/policy.pdf" />
        <button class="btn" id="uploadBtnUrl" onclick="uploadDoc()">Upload</button>
      </div>
    </div>

    <div class="upload-panel" id="panelFile">
      <label class="field-label">Select a file — PDF, DOCX, or EML</label>
      <div class="file-drop" id="fileDrop"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <input type="file" id="fileInput" accept=".pdf,.docx,.eml" onchange="onFileChange(event)" />
        <span class="file-drop-icon">↑</span>
        <div class="file-drop-text">Drag & drop here, or click to browse</div>
        <div class="file-name" id="fileName"></div>
      </div>
      <div class="file-upload-row">
        <button class="btn" id="uploadBtnFile" onclick="uploadFile()">Upload</button>
      </div>
    </div>

    <div class="status" id="uploadStatus"></div>
  </div>

  <!-- Chat -->
  <div class="chat-section">
    <div class="chat-window" id="chatWindow">
      <div class="empty-state">
        <span class="empty-icon">💬</span>
        Upload a document above to start chatting
      </div>
    </div>
    <div class="input-row">
      <input type="text" id="userInput"
        placeholder="Ask a question about your document..."
        onkeydown="if(event.key==='Enter') sendMessage()"
        disabled />
      <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
    </div>
  </div>

</div>

<script>
  let sessionId = null;
  let chatHistory = [];
  let isLoading = false;
  let selectedFile = null;

  // ── Tab switching ───────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('tabUrl').classList.toggle('active', tab === 'url');
    document.getElementById('tabFile').classList.toggle('active', tab === 'file');
    document.getElementById('panelUrl').classList.toggle('active', tab === 'url');
    document.getElementById('panelFile').classList.toggle('active', tab === 'file');
    setStatus('', '');
  }

  // ── File drag/drop helpers ──────────────────────────────
  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('fileDrop').classList.add('drag-over');
  }
  function onDragLeave(e) {
    document.getElementById('fileDrop').classList.remove('drag-over');
  }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById('fileDrop').classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  }
  function onFileChange(e) {
    if (e.target.files[0]) setFile(e.target.files[0]);
  }
  function setFile(file) {
    selectedFile = file;
    document.getElementById('fileName').textContent = file.name;
  }

  // ── Upload via URL ──────────────────────────────────────
  async function uploadDoc() {
    const url = document.getElementById('docUrl').value.trim();
    if (!url) return setStatus('Please enter a document URL.', 'error');

    setStatus('Processing document — this may take 20–30 seconds…', 'loading');
    setUploadDisabled(true);

    try {
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ document_url: url })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Upload failed');

      onIngested(data.session_id);
    } catch (err) {
      setStatus(`${err.message}`, 'error');
      setUploadDisabled(false);
    }
  }

  // ── Upload via file ─────────────────────────────────────
  async function uploadFile() {
    if (!selectedFile) return setStatus('Please select a file first.', 'error');

    setStatus('Processing document — this may take 20–30 seconds…', 'loading');
    setUploadDisabled(true);

    try {
      const formData = new FormData();
      formData.append('file', selectedFile);

      const res = await fetch('/api/upload-file', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Upload failed');

      onIngested(data.session_id);
    } catch (err) {
      setStatus(`${err.message}`, 'error');
      setUploadDisabled(false);
    }
  }

  function onIngested(id) {
    sessionId = id;
    chatHistory = [];
    setStatus('Document ready — start asking questions below.', 'success');
    enableChat();
    clearChat();
    addBubble('bot', "I've read your document. What would you like to know?");
  }

  // ── Chat ────────────────────────────────────────────────
  async function sendMessage() {
    if (isLoading || !sessionId) return;
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    isLoading = true;
    setSendDisabled(true);

    addBubble('user', message);
    const thinkingEl = addThinkingBubble();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          message: message,
          chat_history: chatHistory
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Chat failed');

      thinkingEl.className = 'bubble bot';
      thinkingEl.textContent = data.answer;
      chatHistory = data.chat_history;

    } catch (err) {
      thinkingEl.className = 'bubble bot';
      thinkingEl.textContent = `Something went wrong: ${err.message}`;
    } finally {
      isLoading = false;
      setSendDisabled(false);
      document.getElementById('userInput').focus();
    }
  }

  // ── Helpers ─────────────────────────────────────────────
  function addBubble(role, text) {
    const win = document.getElementById('chatWindow');
    const empty = win.querySelector('.empty-state');
    if (empty) empty.remove();

    const row = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;

    row.appendChild(bubble);
    win.appendChild(row);
    win.scrollTop = win.scrollHeight;
    return bubble;
  }

  function addThinkingBubble() {
    const win = document.getElementById('chatWindow');
    const row = document.createElement('div');
    row.className = 'bubble-row bot';

    const bubble = document.createElement('div');
    bubble.className = 'bubble bot thinking';
    bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

    row.appendChild(bubble);
    win.appendChild(row);
    win.scrollTop = win.scrollHeight;
    return bubble;
  }

  function clearChat() {
    document.getElementById('chatWindow').innerHTML = '';
  }

  function setStatus(msg, type) {
    const el = document.getElementById('uploadStatus');
    el.textContent = msg;
    el.className = `status ${type}`;
  }

  function setUploadDisabled(val) {
    document.getElementById('uploadBtnUrl').disabled = val;
    document.getElementById('uploadBtnFile').disabled = val;
    document.getElementById('docUrl').disabled = val;
    document.getElementById('fileInput').disabled = val;
  }

  function enableChat() {
    document.getElementById('userInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('userInput').focus();
  }

  function setSendDisabled(val) {
    document.getElementById('sendBtn').disabled = val;
    document.getElementById('userInput').disabled = val;
  }
</script>
</body>
</html>
